<text x="24" y="72" fill="#e6edf3">34 skills checked, 0 problems</text>
<text x="24" y="92" fill="#e6edf3"></text>
<text x="24" y="112" fill="#7ee787">$ python3 tools/build.py &amp;&amp; git diff --exit-code &amp;&amp; echo clean</text>
<text x="24" y="132" fill="#e6edf3">34 skills built</text>
<text x="24" y="152" fill="#e6edf3">clean</text>
<text x="24" y="172" fill="#7ee787">$ ls skills | wc -l</text>
<text x="24" y="192" fill="#e6edf3">34</text>
<text x="24" y="212" fill="#7ee787">$ head -4 skills/debug/SKILL.md</text>
<text x="24" y="232" fill="#e6edf3">---</text>
<text x="24" y="252" fill="#e6edf3">name: debug</text>
<text x="24" y="272" fill="#e6edf3">description: Finds the root cause of a bug methodically. Use for errors, crashes, wrong results or flaky behaviour.</text>
<text x="24" y="292" fill="#e6edf3">---</text>
