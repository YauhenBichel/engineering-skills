name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: skills/ and SKILLS.md are built from drafts/
        run: python3 tools/build.py && git diff --exit-code
      - name: every skill has a name, a description and the three sections, under 350 words
        run: python3 tools/check.py
